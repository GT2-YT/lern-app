body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:540px;margin:0 auto;padding:14px 18px 96px}

.card,.flash{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.card b{display:block;font-size:1.3em}.card span{color:var(--mu)}
.flash{min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center;font-size:1.3em;width:100%;box-sizing:border-box}
.flash hr{width:50%;border:0;border-top:1px solid var(--bd)}.flash span,.flash small{font-size:.75em;color:var(--mu)}.flash span{font-size:.85em}
.bar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:8px;margin:10px 0}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--c);color:var(--fg)}
.btn,.btn2{min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:var(--on);margin:6px 6px 0 0}
.btn2{background:none;color:var(--fg);border-color:var(--bd)}
.row .btn,.row .btn2{flex:1;margin:0}
.back{background:none;border:0;color:var(--ac);padding:6px 0}
.seg{display:inline-flex;margin:4px 0}.seg button{min-height:34px;padding:0 16px;border:1px solid var(--bd);background:none}
.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0;margin-left:-1px}.seg .on{background:var(--ac2);border-color:var(--ac);color:var(--fg);position:relative}
.opt{display:block;width:100%;text-align:left;min-height:46px;padding:10px 14px;margin:7px 0;border-radius:10px;border:1px solid var(--bd);background:var(--c)}
.opt.good{border-color:var(--ac);background:var(--ac2)}.opt.wrong{border-color:var(--bad)}
.lnks{margin-top:14px}.lnk{display:block;background:none;border:0;color:var(--mu);padding:6px 0;text-decoration:underline}
.miss{border-bottom:1px solid var(--bd);padding:8px 0}.miss span,.miss small{display:block;color:var(--mu)}
.ok{color:var(--ac)}.bad{color:var(--bad)}
details{margin:26px 0}summary{cursor:pointer;color:var(--mu)}
.row input{flex:1;min-width:0}
.wv{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0}
.wv b{display:block}.wv span,.wv small{display:block;color:var(--mu)}.wv small{font-size:.8em}
.sm{min-height:34px;padding:0 12px;margin:0;flex:none}
#tb{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#tb button{flex:1;min-height:50px;background:none;border:0;color:var(--mu)}
#tb .on{color:var(--ac);font-weight:600}
.login input{margin:6px 0}

function fmtRelTime(ts){
  if(!ts)return "";
  const diff=Date.now()-ts;
  if(diff<90000)return "gerade eben";
  const mins=Math.floor(diff/60000);
  if(mins<60)return `vor ${mins} Min.`;
  const d=new Date(ts),now=new Date();
  const time=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  if(d.toDateString()===now.toDateString())return `Heute, ${time} Uhr`;
  const yest=new Date(now);yest.setDate(now.getDate()-1);
  if(d.toDateString()===yest.toDateString())return `Gestern, ${time} Uhr`;
  const date=d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  return `${date}, ${time} Uhr`;
}

function fmtExpTime(ts){
  if(!ts)return "";
  const diff=ts-Date.now();
  if(diff<=0)return "abgelaufen";
  const mins=Math.ceil(diff/60000);
  if(mins<60)return `in ${mins} Min.`;
  const d=new Date(ts),now=new Date();
  const time=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  if(d.toDateString()===now.toDateString())return `Heute, ${time} Uhr`;
  const tom=new Date(now);tom.setDate(now.getDate()+1);
  if(d.toDateString()===tom.toDateString())return `Morgen, ${time} Uhr`;
  const date=d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  return `${date}, ${time} Uhr`;
}

}

function restore(){
  try{

    if(m.indexOf("acc:")==0){
      const q=m.split(":"),a=ACC.find(x=>x.u==q[1]&&x.h.slice(0,16)==q[2]);
      if(a&&!isExpired(a))M={k:"acc",u:a.u};
      else localStorage.removeItem(MK);
    }
  }catch(e){}
  loadS();
  if(M&&M.k=="acc")initDb();
}

async function loadAcc(silent){
  hookActivity();
  try{
    const {data,error}=await sb.from("konten").select("u,s,i,h,state").order("created_at",{ascending:true});
    if(!error&&Array.isArray(data))ACC=await cleanupExpired(data);
  }catch(e){}
  if(!ACCREADY){ACCREADY=1;restore()}
  if(!silent)render();
}
loadS();

function save(){
  S.t=Date.now();
  S.last=Date.now();
  applyPal();
  clearTimeout(tm);
  if(M&&M.k=="acc"){
    const u=M.u;
    const a=ACC.find(x=>x.u==u);
    if(a&&isExpired(a)){
      cleanupExpired(ACC).then(v=>{ACC=v});
      return;
    }
    if(a&&isNoSave(a)){
      const ms=metaState(a,S.last,S.act||null);
      a.state=ms;
      tm=setTimeout(()=>{
        sb.from("konten").update({state:ms}).eq("u",u).then(()=>{});
      },600);
      return;
    }
    try{localStorage.setItem(lsKey(),JSON.stringify(S))}catch(e){}
    if(a)a.state=S;
    tm=setTimeout(()=>{
      sb.from("konten").update({state:S}).eq("u",u).then(()=>{});
    },600);
  }
}

async function initDb(){
  if(!M||M.k!="acc")return;
  const u=M.u;
  try{
    const {data,error}=await sb.from("konten").select("state").eq("u",u).single();
    if(error||!data||!M||M.u!=u)return;
    const r=data.state||{};
    const a=ACC.find(x=>x.u==u);
    if(a)a.state=r;
    if(a&&isExpired(a)){
      ACC=await cleanupExpired(ACC);
      return;
    }
    if(a&&isNoSave(a)){
      S={k:{},f:[],t:Date.now(),last:Date.now()};
      applyPal();
      const ms=metaState(a,S.last,null);
      a.state=ms;
      await sb.from("konten").update({state:ms}).eq("u",u);
      render();
      return;
    }
    if((r.t||0)>S.t){
      S=Object.assign({k:{},f:[],t:0},r);
      fixS();
      applyPal();
    }
    S.last=Date.now();
    try{localStorage.setItem(lsKey(),JSON.stringify(S))}catch(e){}
    if(a)a.state=S;
    await sb.from("konten").update({state:S}).eq("u",u);
    render();
  }catch(e){}
}

  loadS();T=null;Q=null;V={p:"home"};LM="";AM="";
  if(m&&m.k=="acc")initDb();
  render();scrollTo(0,0);
}

const b64e=u=>btoa(String.fromCharCode(...u)),b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt,it){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return b64e(new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(salt),iterations:it,hash:"SHA-256"},k,256)));
}

async function login(){
  const u=un($("#lu").value),p=$("#lp").value;LU=u;
  const a=ACC.find(x=>x.u==u);
  if(a&&isExpired(a)){
    ACC=await cleanupExpired(ACC);
    LM="Dieser Gastzugang ist abgelaufen und wurde gelöscht.";
    render();return;
  }
  let ok=false;
  if(a&&p){
    try{ok=(await hashPw(p,a.s,a.i))==a.h}
    catch(e){LM="Die Anmeldung geht in diesem Browser leider nicht.";render();return}
  }
  if(!ok){LM="Benutzername oder Passwort stimmt nicht.";render();return}
  setMode({k:"acc",u:a.u});
}

function logout(msg){

}

function genPw(targetId){
  const c="abcdefghjkmnpqrstuvwxyz23456789";let p="";
  crypto.getRandomValues(new Uint8Array(10)).forEach(v=>{p+=c[v%c.length]});
  const el=targetId?$("#"+targetId):($("#np")||$("#gp"));
  if(el){el.value=p;if(targetId==="np")NP_VAL=p}
}

function syncNewInputs(){
  const nu=$("#nu"),np=$("#np"),cv=$("#gcval"),cu=$("#gcunit");
  if(nu)NU_VAL=nu.value;
  if(np)NP_VAL=np.value;
  if(cv)G_CVAL=cv.value;
  if(cu)G_CUNIT=cu.value;
}

  syncNewInputs();
  NEW_TYPE=t;
  render();
}

function setGDur(v){
  syncNewInputs();
  G_DUR=v;

}

function calcGuestExp(){
  let mins=parseInt(G_DUR,10);
  if(G_DUR==="custom"){
    const v=Math.max(1,parseInt(($("#gcval")&&$("#gcval").value)||G_CVAL||"1",10));
    const u=parseInt(($("#gcunit")&&$("#gcunit").value)||G_CUNIT||"60",10);
    mins=v*u;
  }
  if(!mins||mins<1)mins=60;
  return Date.now()+mins*60000;
}

async function createAccount(uInput,pInput,autoLogin){
  if(!autoLogin&&!isAdmin()){AM="Keine Berechtigung.";AE=1;render();return}
  syncNewInputs();
  const u=un(uInput),p=pInput;AM="";AE=1;
  if(!/^[a-z0-9._-]{2,20}$/.test(u))AM="Benutzername: 2 bis 20 Zeichen (Buchstaben, Zahlen, ., -, _).";
  else if(p.length<6)AM="Das Passwort braucht mindestens 6 Zeichen.";
  else if(ACC.some(a=>a.u==u))AM="Diesen Benutzernamen gibt es schon.";
  if(AM){render();return}
  const s=b64e(crypto.getRandomValues(new Uint8Array(16))),i=150000;let h;
  try{h=await hashPw(p,s,i)}catch(e){AM="Konto konnte in diesem Browser nicht erstellt werden.";render();return}
  const t=autoLogin?"perm":NEW_TYPE;
  const initSt=t==="perm"
    ?{k:{},f:[],t:Date.now(),last:autoLogin?Date.now():0,type:"perm"}
    :{type:t,last:0,...(t==="guest"?{exp:calcGuestExp()}:{})};
  AM="Wird in Supabase gespeichert …";AE=0;render();
  const {error}=await sb.from("konten").insert({u,s,i,h,state:initSt});
  if(error){AM="Fehler beim Speichern: "+error.message;AE=1;render();return}
  ACC.push({u,s,i,h,state:initSt});
  NU_VAL="";NP_VAL="";
  AM=t==="guest"
    ?`Gastzugang „${u}“ angelegt (gültig bis ${fmtExpTime(initSt.exp)}).`
    :t==="nosave"
      ?`Konto „${u}“ (ohne Speicherung) wurde angelegt.`
      :`Konto „${u}“ wurde angelegt.`;
  AE=0;
  if(autoLogin)setMode({k:"acc",u});
  else render();
}

async function changePw(u){
  if(!isAdmin())return;
  const el=$("#epw");
  const p=el?el.value:"";
  if(p.length<6){AM="Das neue Passwort braucht mindestens 6 Zeichen.";AE=1;render();return}
  const s=b64e(crypto.getRandomValues(new Uint8Array(16))),i=150000;let h;
  try{h=await hashPw(p,s,i)}catch(e){AM="Fehler beim Verschlüsseln.";AE=1;render();return}
  AM="Passwort wird gespeichert …";AE=0;render();
  const {error}=await sb.from("konten").update({s,i,h}).eq("u",u);
  if(error){AM="Fehler beim Ändern: "+error.message;AE=1;render();return}
  const a=ACC.find(x=>x.u==u);
  if(a){a.s=s;a.i=i;a.h=h}
  if(M&&M.u==u){
    try{localStorage.setItem(MK,"acc:"+u+":"+h.slice(0,16))}catch(e){}
  }
  SET_U="";
  AM="Passwort für „"+u+"“ wurde erfolgreich geändert.";AE=0;
  render();
}

async function delAcc(u){

  ACC=ACC.filter(a=>a.u!=u);
